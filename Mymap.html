    <!-- Leaflet Routing Machine (động cơ điều hướng lấy từ file GPS) -->

    <style>
        #nav-panel { display: none !important; }
        .leaflet-routing-container { display: none !important; }
        #nav-banner { align-items: center; justify-content: space-between; gap: 12px; }
#banner-close { font-size: 20px; line-height: 1; cursor: pointer; opacity: 0.85; flex-shrink: 0; }
        .leaflet-tile-pane { filter: var(--tile-filter, none); }

    #style-toggle {
    position: absolute; right: 12px; bottom: 130px; z-index: 1000;
    display: flex; align-items: center; gap: 6px;
    padding: 9px 14px; border: none; border-radius: 22px;
    background: rgba(255,255,255,0.97); color: #444;
    font-size: 13px; font-weight: bold; font-family: inherit;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15); cursor: pointer;
}
        html, body { height: 100%; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        /* SỬA LỖI HITBOX (VÙNG CLICK) */
        .custom-icon-wrapper { background: none; border: none; }
        .marker-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            height: 100%; width: 100%; cursor: pointer;
        }

        .circle-icon {
            display: flex; justify-content: center; align-items: center; width: 26px; height: 26px;
            border-radius: 50%; color: white; font-size: 13px; margin-bottom: 3px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .marker-text {
            font-size: 13px; font-weight: bold; white-space: nowrap;
            text-shadow: -1.5px -1.5px 0 #fff, 1.5px -1.5px 0 #fff, -1.5px 1.5px 0 #fff, 1.5px 1.5px 0 #fff;
        }
        /* Zoom xa thì ẩn chữ để đỡ rối */
        .hide-labels .marker-text { display: none; }
        .hide-labels .circle-icon { width: 18px; height: 18px; font-size: 9px; margin-bottom: 0; }

        /* Bảng màu Pastel */
        .bg-blue   { background-color: #6eb3f7; } .text-blue   { color: #3b88d8; }
        .bg-green  { background-color: #65d67e; } .text-green  { color: #3eb558; }
        .bg-pink   { background-color: #f778a1; } .text-pink   { color: #d64d78; }
        .bg-orange { background-color: #f7a96e; } .text-orange { color: #d67a36; }
        .bg-teal   { background-color: #4db6ac; } .text-teal   { color: #268b81; }
        .bg-red    { background-color: #ef7d70; } .text-red    { color: #d1493b; }
        .bg-purple { background-color: #a58bd8; } .text-purple { color: #7c5cc4; }
        .bg-brown  { background-color: #c49a76; } .text-brown  { color: #9a6f47; }
        .bg-gold   { background-color: #e5c15a; } .text-gold   { color: #b8922a; }
        .bg-indigo { background-color: #7f9cf5; } .text-indigo { color: #5a75d6; }

        /* CSS BẢNG THÔNG TIN KHI CLICK */
        .leaflet-popup-content-wrapper {
            border-radius: 12px; padding: 0; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .leaflet-popup-content { margin: 0; width: 180px !important; }
        .custom-popup img { width: 100%; height: 70px; object-fit: cover; display: block; }
        .custom-popup .popup-info { padding: 8px 10px; }
        .custom-popup h4 { margin: 0 0 3px 0; font-size: 13.5px; color: #333; font-weight: bold; }
        .custom-popup p { margin: 0; font-size: 11.5px; color: #666; line-height: 1.4; }
        .custom-popup .popup-hours { margin-top: 3px; font-size: 10.5px; color: #888; }

        /* NÚT CHỈ ĐƯỜNG TRONG POPUP */
        .nav-go-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; margin-top: 10px; padding: 8px 10px; border: none;
            background: #3eb558; color: #fff; font-size: 13px; font-weight: bold;
            border-radius: 8px; cursor: pointer; transition: background 0.15s;
        }
        .nav-go-btn:hover { background: #339149; }

        .leaflet-control-zoom { border: none !important; box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important; }

        /* PANEL LỌC THEO NHÓM */
        #filter-panel {
            position: absolute; top: 12px; left: 12px; z-index: 1000;
            background: rgba(255,255,255,0.95); border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            padding: 10px 12px; max-width: 210px;
        }
        #filter-panel h3 { margin: 0 0 8px 0; font-size: 10px; color: #444; }
        .filter-chip {
            display: flex; align-items: center; gap: 7px;
            padding: 4px 8px; margin: 2px 0; border-radius: 8px;
            font-size: 10px; font-weight: 600; color: #444;
            cursor: pointer; user-select: none; transition: background 0.15s;
        }
        @media (hover: hover) {
        .filter-chip:hover { background: #f0f2f5; }
        }
        .filter-chip.off { opacity: 0.35; }
        .filter-chip .dot {
            width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 10px;
        }
        .filter-chip .count { margin-left: auto; color: #999; font-weight: normal; }
        
        /* BĂNG CHỈ DẪN TIẾP THEO (giống Google Maps navigation) — lấy từ file GPS */
        #nav-banner {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            z-index: 1200; background: #3eb558; color: #fff;
            padding: 12px 20px; border-radius: 12px;
            font-size: 15px; font-weight: bold; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            max-width: 70vw; display: none;
        }
        #nav-banner.reroute { background: #f7a96e; }
        #nav-banner.arrive  { background: #3b88d8; }
        #nav-banner.error   { background: #d1493b; }

        /* ĐIỆN THOẠI: xếp dọc để băng chỉ dẫn KHÔNG đè lên header của box điều hướng.
           Trước đây trên mobile băng (z-index 1200) đè header nên chạm thu gọn không được. */
        @media (max-width: 600px) {
            #nav-banner {
                left: 8px; right: 8px; transform: none; max-width: none;
                font-size: 13px; padding: 10px 12px; line-height: 1.35;
                /* giới hạn chiều cao (~2 dòng) để băng không che box điều hướng */
                max-height: 3.4em; overflow: hidden;
            }
            #nav-panel {
                top: 74px;            /* nằm dưới băng, không đè nhau */
                right: 8px;
                max-width: 62vw;
                z-index: 1300;        /* cao hơn băng để header luôn chạm được */
            }
        }
        .leaflet-popup-tip-container { display: none; }
        @media (max-width: 600px) {
    .filter-chip { padding: 10px 8px; font-size: 14px; }
    #filter-panel { max-width: 180px; max-height: 65vh; overflow-y: auto; }
    .leaflet-popup-content { width: 170px !important; }
}
#poi-search-wrap { position: relative; margin: 0 0 6px; }

#poi-search {
    width: 100%;
    box-sizing: border-box;
    padding: 7px 26px 7px 28px;
    border: 1px solid #dce4f0;
    border-radius: 9px;
    background: #fff;
    color: #1b2a4a;
    font-family: inherit;
    font-size: 12px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
}
#poi-search::placeholder { color: #a6afbe; }
#poi-search:focus {
    border-color: #2f5aa8;
    box-shadow: 0 0 0 3px rgba(47,90,168,.14);
}

#poi-search-icon {
    position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
    font-size: 11px; color: #a6afbe; pointer-events: none;
}
#poi-search-clear {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; border: none; border-radius: 50%;
    background: #eef1f6; color: #6b7688;
    font-size: 11px; line-height: 1; cursor: pointer; display: none;
    align-items: center; justify-content: center; padding: 0;
}

#poi-results {
    position: absolute; z-index: 1500;
    margin: 0; padding: 4px; list-style: none;
    background: #fff; border: 1px solid #e3e8f0; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(27,42,74,.16);
    max-height: 46vh; overflow-y: auto;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    display: none;
}
#poi-results li {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 7px; border-radius: 8px;
    font-size: 12px; color: #1b2a4a; cursor: pointer;
}
#poi-results li:hover,
#poi-results li[aria-selected="true"] { background: #eef3fc; }

#poi-results .r-dot {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 10px;
}
#poi-results .r-text { flex: 1; min-width: 0; }
#poi-results .r-name {
    display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-weight: 600; line-height: 1.3;
}
#poi-results .r-cat {
    display: block; font-size: 10px; color: #97a1b2; line-height: 1.4;
}
#poi-results .r-ab { display: flex; gap: 4px; flex-shrink: 0; }
#poi-results .r-ab button {
    width: 19px; height: 19px; padding: 0; border-radius: 50%;
    border: 1px solid #dce4f0; background: #fff; color: #6b7688;
    font-family: inherit; font-size: 10px; font-weight: 700;
    line-height: 1; cursor: pointer;
}
#poi-results .r-ab button:hover { color: #fff; }
#poi-results .r-ab .ab-a:hover { background: #3eb558; border-color: #3eb558; }
#poi-results .r-ab .ab-b:hover { background: #d1493b; border-color: #d1493b; }

#poi-results .r-empty {
    padding: 12px 8px; text-align: center; color: #97a1b2;
    font-size: 11px; cursor: default;
}
#poi-results .r-empty:hover { background: none; }

@media (prefers-reduced-motion: reduce) {
    #poi-search { transition: none; }
}
    </style>
</head>
<body>

    <script>
        var map = L.map('map', { zoomControl: false }).setView([35.948, 136.195], 14);
       
const BASE_STYLES = {
    normal: {
        label: '標準', icon: 'fa-solid fa-map',
        url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',
        labels: true, filter: 'none'
    },
    outdoor: {   // Trời nắng: vẫn nền Voyager sạch, chỉ đẩy contrast + độ bão hòa
        label: '屋外', icon: 'fa-solid fa-sun',
        url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',
        labels: true,
        filter: 'contrast(1.25) saturate(1.55) brightness(0.96)'
    },
    night: {     // Ban đêm: nền tối, marker màu nổi bật hơn hẳn
        label: '夜間', icon: 'fa-solid fa-moon',
        url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        labels: false, filter: 'none'
    }
};
const STYLE_ORDER = ['normal', 'outdoor', 'night'];
let styleIndex = 0;

var baseTile = L.tileLayer(BASE_STYLES.normal.url, {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
    maxZoom: 20, maxNativeZoom: 19
}).addTo(map);

var labelLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}@2x.png', {
    maxZoom: 20, maxNativeZoom: 19, pane: 'shadowPane'
}).addTo(map);

function applyBaseStyle(key) {
    const s = BASE_STYLES[key];
    baseTile.setUrl(s.url);
    // OSM và dark_all đã có sẵn tên đường → tắt lớp nhãn rời để không bị chữ chồng chữ
    if (s.labels) { if (!map.hasLayer(labelLayer)) labelLayer.addTo(map); }
    else if (map.hasLayer(labelLayer)) map.removeLayer(labelLayer);
    document.getElementById('map').style.setProperty('--tile-filter', s.filter);
    document.getElementById('style-toggle').innerHTML = `<i class="${s.icon}"></i> ${s.label}`;
}

document.getElementById('style-toggle').addEventListener('click', () => {
    styleIndex = (styleIndex + 1) % STYLE_ORDER.length;
    applyBaseStyle(STYLE_ORDER[styleIndex]);
});
applyBaseStyle('normal');

        /* ═══════════════════════════════════════════════════════════════════

        // --- Cấu hình định tuyến ---
        // LƯU Ý: server OSRM demo công cộng (router.project-osrm.org) hiện chỉ
        // hỗ trợ hồ sơ "driving" (ô tô). Muốn đi bộ ("foot") ổn định cần dựng
        // server OSRM riêng. Để bản đồ luôn chạy được, mặc định để "driving".
        const OSRM_SERVICE = 'http://localhost:5001/route/v1';
        const OSRM_PROFILE = 'bicycle';// đổi 'foot' nếu bạn có server hỗ trợ đi bộ

        const OFF_ROUTE_THRESHOLD = 50;   // lệch quá 50m → tính lại đường
        const ARRIVAL_THRESHOLD   = 30;   // cách đích < 30m → đã đến nơi

        // --- Trạng thái điều hướng ---
        let userMarker = null, accuracyCircle = null;
        let routingControl = null, currentRoute = null;
        let watchId = null, isNavigating = false, firstFix = true, triedLowAccuracy = false;
        let navDestination = null, navDestName = '';
        let followGPS= true;
        // --- Marker vị trí hiện tại (chấm xanh giống Google Maps) ---
        const userIcon = L.divIcon({
            className: '',
            html: `<div style="width:18px;height:18px;background:#1a73e8;
                   border:3px solid white;border-radius:50%;
                   box-shadow:0 0 8px rgba(26,115,232,0.8);"></div>`,
            iconSize: [18, 18], iconAnchor: [9, 9]
        });

        // --- DOM (đặt tên riêng để KHÔNG đụng biến "panel" của filter) ---
        const navBanner  = document.getElementById('nav-banner');
        function onBannerTap(e) {
            if (e.target && e.target.id === 'banner-close') {
                navBanner.style.display = 'none';
            }
        }
        navBanner.addEventListener('touchend', onBannerTap, { passive: true });
        navBanner.addEventListener('click', onBannerTap);
        const navPanel   = document.getElementById('nav-panel');
        const navSummary = document.getElementById('nav-summary');
        const navSteps   = document.getElementById('nav-steps');

        // Helper: gắn cả 'click' (desktop) lẫn 'touchend' (iOS/Android),
        // chống double-fire bằng mốc thời gian. iOS thường không bắn 'click'
        // trên <div> thường nên bắt buộc phải lắng nghe 'touchend'.
        function bindTap(el, handler) {
            let last = 0;
            function run(e) {
                const now = Date.now();
                if (now - last < 400) return;   // bỏ qua click "ma" sau touchend
                last = now;
                handler(e);
            }
            el.addEventListener('touchend', run, { passive: true });
            el.addEventListener('click', run);
        }

                // Nút × đóng điều hướng
        bindTap(document.getElementById('nav-close'), function(e) {
            if (e.stopPropagation) e.stopPropagation();

        bindTap(document.getElementById('nav-header'), function(e) {

    function showBanner(text, cls) {
    navBanner.className = '';

        // ═══ 1. BẮT ĐẦU ĐIỀU HƯỚNG TỚI 1 ĐIỂM (gọi từ nút trong popup) 
        // ═══
        window.startNavigationTo = function(lat, lng, name) {
            if (!('geolocation' in navigator)) {
                alert(' GPS 未対応です');
                return;
            }
            // Nếu đang dẫn đường tới điểm khác → dọn tuyến cũ trước
             resetRoute();

            navDestination = L.latLng(lat, lng);
            navDestName = name || '';
            isNavigating = true;
            firstFix = true;

            map.closePopup();
            showBanner('📍 GPSの位置を取得中... ');
            navPanel.style.display = 'block';
            navSummary.textContent = navDestName + '  ここへ行く';
            navSteps.innerHTML = '';

            triedLowAccuracy = false;
            beginWatch(true);   // thử độ chính xác cao trước
        };

        // Bắt đầu theo dõi GPS. timeout 30s + cho dùng vị trí cache (maximumAge)
        // để tránh lỗi timeout trên máy tính không có chip GPS thật.
        function beginWatch(highAccuracy) {
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            watchId = navigator.geolocation.watchPosition(
                onPositionUpdate, onPositionError,
                { enableHighAccuracy: highAccuracy, maximumAge: 30000, timeout: 30000 }
            );
        }

        // ═══ 2. MỖI LẦN GPS CẬP NHẬT ═══
        function onPositionUpdate(position) {
            
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            const currentPos = L.latLng(lat, lng);

            // Cập nhật marker vị trí + vòng độ chính xác
            if (!userMarker) {
                userMarker = L.marker(currentPos, { icon: userIcon }).addTo(map);
                accuracyCircle = L.circle(currentPos, {
                    radius: accuracy, color: '#1a73e8', fillOpacity: 0.1, weight: 1
                }).addTo(map);
            } else {
                userMarker.setLatLng(currentPos);
                accuracyCircle.setLatLng(currentPos).setRadius(accuracy);
            }

            // Camera bám theo vị trí: lần đầu zoom 17, sau đó chỉ pan (để user tự zoom)
            if (firstFix) {
                map.setView(currentPos, 17, { animate: true });
                firstFix = false;
                followGPS = true;
            } else if(followGPS){
                map.panTo(currentPos, { animate: true });
            }

            // Lần đầu → tạo route; các lần sau → kiểm tra tiến độ
            if (!routingControl) createRoute(currentPos);
            else checkProgress(currentPos);
        }

        function onPositionError(err) {
            // Timeout (mã 3): thử lại 1 lần ở độ chính xác thấp — nhanh hơn,
            // hợp máy tính lấy vị trí qua Wi-Fi/IP thay vì GPS thật.
            if (err.code === 3 && !triedLowAccuracy) {
                triedLowAccuracy = true;
                showBanner('📡 Đang thử lại (độ chính xác thấp)... / 位置を再取得中...', 'reroute');
                beginWatch(false);
                return;
            }
            const messages = {
                1: 'Bạn chưa cấp quyền vị trí / 位置情報が拒否されました',
                2: 'Không lấy được tín hiệu GPS / GPS 取得失敗',
                3: 'GPS timeout — không lấy được vị trí / 位置情報がタイムアウトしました'
            };
            showBanner('⚠ ' + (messages[err.code] || err.message), 'error');
        }

        // ═══ 3. TẠO ROUTE TỪ VỊ TRÍ HIỆN TẠI ═══
        function createRoute(from) {
            routingControl = L.Routing.control({
                waypoints: [from, navDestination],
                router: L.Routing.osrmv1({ serviceUrl: OSRM_SERVICE, profile: OSRM_PROFILE }),
                lineOptions: { styles: [{ color: '#1a73e8', weight: 6, opacity: 0.8 }] },
                show: false,               // ẩn bảng mặc định của LRM, ta dùng panel riêng
                addWaypoints: false,
                fitSelectedRoutes: false,  // không zoom về toàn route, giữ camera theo GPS
                createMarker: () => null   // không tạo marker A/B mặc định
            }).addTo(map);

            routingControl.on('routesfound', (e) => {
                currentRoute = e.routes[0];
                populateSteps();
                showNextInstruction(0);
            });

            routingControl.on('routingerror', (e) => {
                console.error('Routing error:', e && e.error);
                showBanner('⚠ ルート検索に失敗しました', 'error');
            });
        }

        // Đổ tóm tắt + danh sách bước vào nav-panel (tận dụng khung có sẵn)
        function populateSteps() {
            if (!currentRoute) return;
            const km  = (currentRoute.summary.totalDistance / 1000).toFixed(1);
            const min = Math.round(currentRoute.summary.totalTime / 60);
            navSummary.textContent = `${navDestName} まで ${km} km ・ 約 ${min} 分`;
            navSteps.innerHTML = '';
            currentRoute.instructions.forEach((inst) => {
                const li = document.createElement('li');
                const d = inst.distance ? ` (${Math.round(inst.distance)}m)` : '';
                li.textContent = inst.text + d;
                navSteps.appendChild(li);
            });
        }

        // ═══ 4. KIỂM TRA TIẾN ĐỘ + RE-ROUTE KHI LỆCH ĐƯỜNG ═══
        function checkProgress(currentPos) {
            if (!currentRoute) return;

            // Đã đến đích chưa?
            if (currentPos.distanceTo(navDestination) < ARRIVAL_THRESHOLD) {
                showBanner('🎉 目的地に到着しました', 'arrive');
                // dừng theo dõi GPS nhưng giữ tuyến hiển thị vài giây
                if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
                isNavigating = false;
                return;
            }

            // Tìm điểm gần nhất trên route để biết có lệch đường không
            const coords = currentRoute.coordinates;
            let minDist = Infinity, nearestIndex = 0;
            for (let i = 0; i < coords.length; i++) {
                const d = currentPos.distanceTo(coords[i]);
                if (d < minDist) { minDist = d; nearestIndex = i; }
            }

            if (minDist > OFF_ROUTE_THRESHOLD) {
                // Lệch đường → tính lại từ vị trí hiện tại
                showBanner('🔄 ルート再検索中... / Đang tính lại đường...', 'reroute');
                routingControl.setWaypoints([currentPos, navDestination]);
            } else {
                // Vẫn trên đường → hiện chỉ dẫn tiếp theo
                updateInstruction(nearestIndex, currentPos);
            }
        }

        // ═══ 5. HIỂN THỊ CHỈ DẪN TIẾP THEO ═══
        function updateInstruction(nearestCoordIndex, currentPos) {
            const instructions = currentRoute.instructions;
            for (let i = 0; i < instructions.length; i++) {
                if (instructions[i].index >= nearestCoordIndex) {
                    const inst = instructions[i];
                    const distToTurn = Math.round(
                        currentPos.distanceTo(currentRoute.coordinates[inst.index])
                    );
                    showBanner(`${distToTurn}m — ${inst.text}`);
                    return;
                }
            }
        }

        function showNextInstruction(i) {
            if (currentRoute && currentRoute.instructions[i]) {
                showBanner(currentRoute.instructions[i].text);
            }
        }

        // Xoá tuyến + reset (dùng khi bắt đầu tuyến mới)
        function resetRoute() {
            if (routingControl) { map.removeControl(routingControl); routingControl = null; }
            currentRoute = null;
        }

        function stopNavigation() {
            if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            if (userMarker)     { map.removeLayer(userMarker);     userMarker = null; }
            if (accuracyCircle) { map.removeLayer(accuracyCircle); accuracyCircle = null; }
            resetRoute();
            isNavigating = false;
            followGPS = false;
            navPanel.style.display = 'none';
            navBanner.style.display = 'none';
        }
// ── Chọn điểm A/B bằng cách chạm bản đồ ──
        let pointA = null, pointB = null;
        let markerA = null, markerB = null, pickMode = null;
        let selectedStopMarkers = [];

        const iconA = L.divIcon({ className:'', html:`<div style="width:22px;height:22px;
            background:#3eb558;border:3px solid #fff;border-radius:50%;
            box-shadow:0 0 6px rgba(0,0,0,.4);display:flex;align-items:center;
            justify-content:center;color:#fff;font-weight:bold;font-size:12px;">A</div>`,
            iconSize:[22,22], iconAnchor:[11,11] });
        const iconB = L.divIcon({ className:'', html:`<div style="width:22px;height:22px;
            background:#d1493b;border:3px solid #fff;border-radius:50%;
            box-shadow:0 0 6px rgba(0,0,0,.4);display:flex;align-items:center;
            justify-content:center;color:#fff;font-weight:bold;font-size:12px;">B</div>`,
            iconSize:[22,22], iconAnchor:[11,11] });

        document.getElementById('set-a').addEventListener('click', () => {
            pickMode = 'A';
            setMarkersClickable(false);
            showBanner('🟢 地図をタップして出発地Aを指定 ');

        // ── Gọi backend lập lộ trình ──
        async function planTrip(startLatLng, endLatLng) {
          showBanner('🧭 ルート計算中... ');
          try {
            const res = await fetch('http://localhost:3000/api/plan', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
           body: JSON.stringify({
                start: [startLatLng.lat, startLatLng.lng],
                end:   [endLatLng.lat, endLatLng.lng],
                accidents: accidentPoints,
                attractions: sabaeLocations.map(s => ({
                    lat: s.lat, lng: s.lng, name: s.name, group: s.group
                })),
                detourBudget: 2.5,
                accidentAvoidance: 1.0,     // tránh tối đa
                accidentBufferM: 150,       // coi là "gần" trong 250m
                accidentSeconds: 600,       // phạt nặng: mỗi điểm ~10 phút
                corridorKm: 3
              })
            });
            const plan = await res.json();
            if (plan.error) { showBanner('⚠ ' + plan.error, 'error'); return; }

            // Vẽ đường
            if (window._planLayer) map.removeLayer(window._planLayer);
            window._planLayer = L.geoJSON(plan.geometry, {
              style: { color: '#7c3aed', weight: 6, opacity: 0.85 }
            }).addTo(map);

            // Đánh dấu các điểm ĐƯỢC chọn ghé (để thấy rõ đường đi qua đâu)
            selectedStopMarkers.forEach(m => map.removeLayer(m));
            selectedStopMarkers = plan.stops.map((s, i) =>
              L.marker([s.lat, s.lng], { icon: L.divIcon({ className:'',
                html:`<div style="width:20px;height:20px;background:#7c3aed;
                     border:2px solid #fff;border-radius:50%;color:#fff;font-size:11px;
                     display:flex;align-items:center;justify-content:center;
                     box-shadow:0 0 5px rgba(0,0,0,.4);">${i+1}</div>`,
                iconSize:[20,20], iconAnchor:[10,10] }) })
                .bindPopup(`<b>${i+1}. ${s.name}</b>`).addTo(map)
            );

            map.fitBounds(window._planLayer.getBounds(), { padding:[40,40] });
            showBanner(`${plan.distanceKm}km ・ ${plan.durationMin}分 ・  +
                       ${plan.stops.length}箇所 ・ 事故付近 ${plan.accidentsNear}`, 'arrive');
          } catch (err) {
            showBanner('⚠ サーバーに接続できません ', 'error');
            console.error(err);
          }
        }

        document.getElementById('plan-btn').addEventListener('click', () => {
          if (!pointA || !pointB) {
            showBanner('⚠ 先にAとBを指定してください ', 'error');
            return;
          }
          planTrip(pointA, pointB);
        });
        function clearPlan() {
            if (window._planLayer) { map.removeLayer(window._planLayer); window._planLayer = null; }
            selectedStopMarkers.forEach(m => map.removeLayer(m));
            selectedStopMarkers = [];
            if (markerA) { map.removeLayer(markerA); markerA = null; }
            if (markerB) { map.removeLayer(markerB); markerB = null; }
            pointA = null; pointB = null; pickMode = null;
            navBanner.style.display = 'none';
        }
        document.getElementById('clear-btn').addEventListener('click', clearPlan);

    if (window.innerWidth < 600) {
    panel.querySelectorAll('.filter-chip').forEach(c => c.style.display = 'none');
}
map.on('dragstart', function() {followGPS =false;});
 if (window.innerWidth < 600) {
    panel.querySelectorAll('.filter-chip').forEach(c => c.style.display = 'none');
}
map.on('dragstart', function() {followGPS =false;});
document.getElementById('recenter-btn').addEventListener('click', function() {
    followGPS = true;
    if (userMarker) {
        map.setView(userMarker.getLatLng(), 17, { animate: true });
    } else if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(function(pos) {
            map.setView([pos.coords.latitude, pos.coords.longitude], 17, { animate: true });
        });
    }
});

(function () {

    Object.keys(layers).forEach(function (g) {
        var list = sabaeLocations.filter(function (s) { return s.group === g; });
        var i = 0;
        layers[g].eachLayer(function (m) { if (list[i]) list[i++]._marker = m; });
    });

    var wrap = document.createElement('div');
    wrap.id = 'poi-search-wrap';
    wrap.innerHTML =
        '<i id="poi-search-icon" class="fa-solid fa-magnifying-glass"></i>' +
        '<input id="poi-search" type="search" autocomplete="off" ' +
               'placeholder="スポットを検索" aria-label="スポットを検索">' +
        '<button id="poi-search-clear" type="button" aria-label="消去">' +
        '<i class="fa-solid fa-xmark"></i></button>';

    var panelEl = document.getElementById('filter-panel');
    panelEl.insertBefore(wrap, panelEl.children[1] || null);

    var box = document.createElement('ul');
    box.id = 'poi-results';
    box.setAttribute('role', 'listbox');
    document.body.appendChild(box);

    var input   = document.getElementById('poi-search');
    var clearEl = document.getElementById('poi-search-clear');

    function norm(s) {
        return String(s || '').toLowerCase()
            .replace(/[\uff01-\uff5e]/g, function (c) {
                return String.fromCharCode(c.charCodeAt(0) - 0xfee0);
            })
            .replace(/[\u30a1-\u30f6]/g, function (c) {
                return String.fromCharCode(c.charCodeAt(0) - 0x60);
            });
    }

    var index = sabaeLocations.map(function (s) {
        var g = GROUPS[s.group] || {};
        return {
            spot: s,
            group: s.group,
            label: g.label || '',
            icon: g.icon || 'fa-solid fa-location-dot',
            theme: g.theme || 'blue',
            hay: norm(s.name + ' ' + (g.label || ''))
        };
    });

    var results = [], active = -1;

    function position() {
        var r = input.getBoundingClientRect();
        box.style.top   = (window.scrollY + r.bottom + 6) + 'px';
        box.style.left  = (window.scrollX + r.left) + 'px';
        box.style.width = Math.max(r.width, 236) + 'px';
    }

    function render() {
        box.innerHTML = '';
        if (!results.length) {
            box.innerHTML = '<li class="r-empty">該当するスポットがありません</li>';
        } else {
            results.forEach(function (it, i) {
                var li = document.createElement('li');
                li.setAttribute('role', 'option');
                li.setAttribute('aria-selected', i === active ? 'true' : 'false');
                li.innerHTML =
                    '<span class="r-dot bg-' + it.theme + '"><i class="' + it.icon + '"></i></span>' +
                    '<span class="r-text"><span class="r-name"></span>' +
                    '<span class="r-cat">' + it.label + '</span></span>' +
                    '<span class="r-ab">' +
                      '<button type="button" class="ab-a" title="出発地に設定">A</button>' +
                      '<button type="button" class="ab-b" title="目的地に設定">B</button>' +
                    '</span>';
                li.querySelector('.r-name').textContent = it.spot.name;
                li.addEventListener('click', function (e) {
                    if (e.target.closest('.ab-a')) { setPoint('A', it); return; }
                    if (e.target.closest('.ab-b')) { setPoint('B', it); return; }
                    goTo(it);
                });
                box.appendChild(li);
            });
        }
        position();
        box.style.display = 'block';
    }

    function close() { box.style.display = 'none'; active = -1; }

    function ensureVisible(it) {
        var lg = layers[it.group];
        if (!lg || map.hasLayer(lg)) return;
        lg.addTo(map);
        var chip = document.querySelector('.filter-chip[data-group="' + it.group + '"]');
        if (chip) chip.classList.remove('off');
    }

    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function goTo(it) {
        ensureVisible(it);
        var ll = [it.spot.lat, it.spot.lng];
        if (reduceMotion) map.setView(ll, 17);
        else map.flyTo(ll, 17, { duration: 0.7 });
        if (it.spot._marker) {
            setTimeout(function () { it.spot._marker.openPopup(); }, reduceMotion ? 0 : 750);
        }
        input.value = it.spot.name;
        clearEl.style.display = 'flex';
        close();
    }

    function setPoint(which, it) {
        ensureVisible(it);
        var ll = L.latLng(it.spot.lat, it.spot.lng);
        if (which === 'A') {
            pointA = ll;
            if (markerA) markerA.setLatLng(ll);
            else markerA = L.marker(ll, { icon: iconA }).addTo(map);
            showBanner('🟢 出発地: ' + it.spot.name);
        } else {
            pointB = ll;
            if (markerB) markerB.setLatLng(ll);
            else markerB = L.marker(ll, { icon: iconB }).addTo(map);
            showBanner('🔴 目的地: ' + it.spot.name);
        }
        map.setView(ll, Math.max(map.getZoom(), 15));
        close();
    }

    function search() {
        var key = norm(input.value.trim());
        clearEl.style.display = key ? 'flex' : 'none';
        if (!key) { close(); return; }
        results = index.filter(function (it) { return it.hay.indexOf(key) !== -1; })
                       .slice(0, 8);
        active = -1;
        render();
    }

    input.addEventListener('input', search);
    input.addEventListener('focus', function () { if (input.value.trim()) search(); });

    input.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { close(); input.blur(); return; }
        if (box.style.display !== 'block' || !results.length) return;
        if (e.key === 'ArrowDown') {
            e.preventDefault(); active = Math.min(active + 1, results.length - 1); render();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault(); active = Math.max(active - 1, 0); render();
        } else if (e.key === 'Enter') {
            e.preventDefault(); goTo(results[active >= 0 ? active : 0]);
        }
    });

    clearEl.addEventListener('click', function () {
        input.value = ''; clearEl.style.display = 'none'; close(); input.focus();
    });

    document.addEventListener('click', function (e) {
        if (!wrap.contains(e.target) && !box.contains(e.target)) close();
    });
    map.on('movestart zoomstart', close);
    window.addEventListener('resize', function () {
        if (box.style.display === 'block') position();
    });

    L.DomEvent.disableClickPropagation(wrap);
    L.DomEvent.disableScrollPropagation(wrap);
    L.DomEvent.disableClickPropagation(box);
    L.DomEvent.disableScrollPropagation(box);
})();
    </script>
